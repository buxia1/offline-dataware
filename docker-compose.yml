services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    volumes:
      # ⚠️ 容器内路径必须与 KAFKA_LOG_DIRS 完全一致
      #    KRaft 的元数据里记的是绝对路径，改路径会导致集群起不来
      - ./kafka/logs:/tmp/kraft-combined-logs
    environment:
      # KRaft 单节点身份
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # 双 listener：容器内用 29092，主机侧用 9092
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 单副本
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # 数据目录（2026-10-10 起已挂载到宿主 ./kafka/logs，见上方 volumes）
      # ⚠️ 此路径与 volumes 的容器侧路径必须一致，改一处就得改另一处
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # 内存压到 512M
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"

  starrocks:
    image: starrocks/allin1-ubuntu:3.5.0
    container_name: starrocks
    hostname: starrocks
    restart: unless-stopped
    mem_limit: 3g
    ports:
      - "8030:8030"
      - "9030:9030"
      - "8040:8040"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./starrocks/fe/meta:/data/deploy/starrocks/fe/meta
      - ./starrocks/fe/log:/data/deploy/starrocks/fe/log
      - ./starrocks/be/storage:/data/deploy/starrocks/be/storage
      - ./starrocks/be/log:/data/deploy/starrocks/be/log
      # fe.conf 挂进项目（2026-10-10）：镜像自带的 fe.conf 是 -Xmx8192m，
      # 但容器只给 3g，放量后会被 OOM kill。挂目录而不是单文件——
      # entrypoint.sh 启动时要写 fe.conf，挂单文件（:ro）会报 Read-only file system 起不来。
      - ./starrocks/fe/conf:/data/deploy/starrocks/fe/conf
      # 湖层（Iceberg warehouse）—— 与 spark 挂到宿主同一份文件
      - ./lake:/data/deploy/starrocks/lake

  spark:
    image: apache/spark:3.5.1
    container_name: spark
    hostname: spark
    restart: unless-stopped
    mem_limit: 2g
    environment:
      TZ: Asia/Shanghai
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - ./scripts:/opt/offline-dw/scripts
      - ./sql:/opt/offline-dw/sql
      - ./data:/opt/offline-dw/data
      # 湖层（Spark 写入端，容器内 uid=185）—— 与 starrocks 指向宿主同一目录
      - ./lake:/opt/offline-dw/lake
      # Iceberg runtime（2026-10-10）：apache/spark:3.5.1 不含任何湖仓连接器。
      # ⚠️ 必须挂【单个文件】，不能挂 ./spark/jars 整个目录——
      #    bind mount 是"用宿主目录替换容器目录"，不是合并：
      #    挂目录会把镜像自带的 252 个 jar 全部盖掉，Spark 直接
      #    ClassNotFoundException: org.apache.spark.launcher.Main 起不来（已实测踩到）。
      #    挂到独立路径，作业里用 --jars 引用。
      - ./spark/jars/iceberg-spark-runtime-3.5_2.12-1.9.0.jar:/opt/offline-dw/jars/iceberg-spark-runtime-3.5_2.12-1.9.0.jar

  mysql:
    image: mysql:8.0
    container_name: mysql
    hostname: mysql
    restart: unless-stopped
    mem_limit: 600m
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: dolphinscheduler
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb_buffer_pool_size=134217728
    ports:
      - "13306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql

  dolphinscheduler:
    image: apache/dolphinscheduler-standalone-server:3.2.0
    container_name: dolphinscheduler
    hostname: dolphinscheduler
    restart: unless-stopped
    mem_limit: 2g
    depends_on:
      - mysql
    ports:
      - "12345:12345"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms512m -Xmx1024m -Xmn256m -XX:MaxMetaspaceSize=256m"
      DATABASE_TYPE: mysql
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dolphinscheduler?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_JACKSON_TIME_ZONE: Asia/Shanghai
    volumes:
      - ./ds/logs:/opt/dolphinscheduler/logs
      - ./ds/libs/mysql-connector-java-8.0.30.jar:/opt/dolphinscheduler/libs/standalone-server/mysql-connector-java-8.0.30.jar
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ds/bin/docker:/usr/local/bin/docker:ro
      - ./sql:/opt/offline-dw/sql:ro
      - ./scripts:/opt/offline-dw/scripts:ro
      - ./ds/alerts:/opt/ds-alerts

